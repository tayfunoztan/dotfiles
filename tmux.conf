# Change prefix to C-a
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Support 256 colors
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Focus events enabled for terminals that support them
set-option -g focus-events on

# Don't wait for escape sequence.
set-option -s escape-time 0

# History
set-option -g history-limit 102400

# Mouse mode on
set -g mouse on

# Index starts from 1
set-option -g base-index 1
set-option -g pane-base-index 1

# History
set-option -g history-limit 50000

# Automatically rename window
set-window-option -g automatic-rename on

# Renumber windows when a window is closed
set-option -g renumber-windows on


# Automatically set title
set-option -g set-titles on
set-option -g set-titles-string '❐ #S ● #I'

# Monitor activity
set-window-option -g monitor-activity on
set -g visual-activity on
set -g visual-bell off

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# -----------------------------------------------------------------------------
# Key Bindings
# -----------------------------------------------------------------------------
# Reload ~/.tmux.conf
bind-key R source-file ~/.tmux.conf \; display-message "Reloaded!"

# prefix v
bind-key v split-window -h -c "#{pane_current_path}"

# prefix s
bind-key s split-window -c "#{pane_current_path}"

# Moving windows
bind-key -r > swap-window -d -t :+
bind-key -r < swap-window -d -t :-

# Back and forth window 
unbind n
unbind p
bind-key C-a last-window        # last window


# Synchronize panes
bind-key C-s set-window-option synchronize-pane

# Copy-mode
set-window-option -g mode-keys vi

# Update default binding of `Enter` and `Space to also use copy-pipe
unbind -T copy-mode-vi Enter
unbind -T copy-mode-vi Space

bind-key -T edit-mode-vi Up send-keys -X history-up
bind-key -T edit-mode-vi Down send-keys -X history-down

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection

# Copy text with `y` in copy mode
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Copy text with mouse selection without pressing any key
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# Use key map for the status bar.
set-option -g status-keys vi

# -------------------------------------------------------------------
# Decoration (256-color)
# -------------------------------------------------------------------

# --> Catppuccin (Macchiato)
thm_bg="#24273a"
thm_fg="#cad3f5"
thm_cyan="#91d7e3"
thm_black="#1e2030"
thm_gray="#363a4f"
thm_magenta="#c6a0f6"
thm_pink="#f5bde6"
thm_red="#ed8796"
thm_green="#a6da95"
thm_yellow="#eed49f"
thm_blue="#8aadf4"
thm_orange="#f5a97f"
thm_black4="#5b6078"

set-option -g status-position top
set-option -g status-right-length 100
set-option -g status-left-length 100
set-option -g status-style "fg=$thm_fg,bg=$thm_bg"
set-option -g status-right "#[fg=$thm_pink,bg=$thm_gray] %e %B %A %H:%M "
set-option -g status-left "#[fg=$thm_fg,bg=#{?client_prefix,$thm_orange,$thm_gray},nobold,nounderscore,noitalics]  #[fg=$thm_fg,bg=$thm_gray,bold] #S "
set-option -g status-justify centre
set-window-option -g window-status-separator " "
set-window-option -g window-status-format " #W "
set-window-option -g window-status-current-format "#[bold,underscore] #W "
set-window-option -g window-status-activity-style "fg=${thm_yellow},bg=${thm_gray},none"
set-window-option -g window-status-current-style "fg=${thm_pink},bg=${thm_gray},none"
set-window-option -g window-status-style "fg=${thm_fg},bg=${thm_gray},none"

# Panes
set -g pane-border-style "fg=white"
set -g display-panes-colour "black"
set -g display-panes-active-colour "white"
set -g pane-border-status "top"
set -g pane-border-format "[ #T #[fg=default,nobold]]"

# ================================================
# Plugins
# ================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
